[package]
name = "sfwm"
version = "0.1.0"
edition = "2021"
description = "sommerfluss window manager — a herbstluftwm successor on river, with virtual/overlapping monitors"

[[bin]]
name = "sfwm"
path = "src/main.rs"

[dependencies]
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
# viewporter + single-pixel-buffer: scale a 1x1 dim buffer over inactive windows
# (in-WM "dim inactive" decoration, replacing a picom effect).
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
bitflags = "2"
calloop = "0.14"
calloop-wayland-source = "0.4"
# Resolve key names (incl. XF86*) to xkbcommon keysyms for river_xkb_bindings_v1.
xkbcommon = "0.9"
