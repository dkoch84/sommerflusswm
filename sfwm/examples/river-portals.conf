# xdg-desktop-portal backend selection for river/sfwm sessions
# (XDG_CURRENT_DESKTOP=river makes xdg-desktop-portal read this file).
# ScreenCast/Screenshot go to the wlroots backend (xdg-desktop-portal-wlr);
# everything else (file choosers etc.) to the GTK portal.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
